<!DOCTYPE html>
<html>
<head>
    <title>AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-container">
<div class="ai-avatar-container">

    <div class="ai-glow"></div>
<div class="status-ring" id="statusRing"></div>
    <img
    src="https://cdn-icons-png.flaticon.com/512/8943/8943377.png"
    class="ai-avatar"
    id="aiAvatar"
    >

</div>
    <div class="chat-header">

    <div class="header-title">
        GONMEI AI

        <div class="chat-subtitle">
            Your AI assistant is here to help!
        </div>
    </div>

    <div class="header-actions">

        <button onclick="downloadChat()">📄</button>

        <button onclick="clearChat()">🗑️</button>

        <button onclick="toggleTheme()">🌙</button>

    </div>

</div>
    <div class="chat-box" id="chatBox">
</div>

    <div class="chat-input">           ️
</button>

    <select id="personality">

    <option value="assistant">
        🤖 Assistant
    </option>

    <option value="teacher">
        👨‍🏫 Teacher
    </option>

    <option value="programmer">
        👨‍💻 Programmer
    </option>

    <option value="motivator">
        💪 Motivator
    </option>

    <option value="poet">
        ✍️ Poet
    </option>

</select>
        <input
            type="text"
            id="userInput"
            placeholder="Ask anything..."
        >

        <button onclick="startVoice()">
    🎤
</button>

<button onclick="sendMessage()">
    Send
</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
